<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turnee Fotbal</title>
<meta name="description" content="Turnee de fotbal pentru copii: înscrierea școlilor, program, scoruri și clasament live.">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="fonts.css">
<style>
html{color-scheme:light}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}

/* Layout: tabloul de marcaj al unui turneu: antet cu linii de teren, trei fețe (organizator / echipă / părinte), conținut pe carduri late. */
:root{
  --bg:#edf0ea; --surface:#ffffff; --surface2:#f4f6f2; --ink:#16231b; --muted:#5b6a60; --line:#d3dacf;
  --accent:#1b6b44; --accent-ink:#ffffff; --live:#c9400a; --warn:#8a5a00; --bad:#a8261f; --good:#1b6b44;
  --font-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1612; --surface:#16211b; --surface2:#1b2821; --ink:#e6eee8; --muted:#8fa196; --line:#27362d;
  --accent:#4cb883; --accent-ink:#06170e; --live:#ff8b52; --warn:#e0b04a; --bad:#ff7a72; --good:#4cb883; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1612; --surface:#16211b; --surface2:#1b2821; --ink:#e6eee8; --muted:#8fa196; --line:#27362d;
  --accent:#4cb883; --accent-ink:#06170e; --live:#ff8b52; --warn:#e0b04a; --bad:#ff7a72; --good:#4cb883; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:26px;line-height:1.1}
h3{font-size:19px;line-height:1.15}
.wrap{max-width:1000px;margin:0 auto}
.hdr{padding:22px 0 14px;border-bottom:2px solid var(--ink);position:relative}
.hdr::after{content:"";position:absolute;left:0;bottom:-8px;width:100%;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:14px;align-items:center}.logo{flex:none;height:auto;width:56px}@media (max-width:480px){.logo{width:44px}}
.hdr h1{font-size:clamp(34px,7vw,52px);line-height:.95;text-transform:uppercase}
.hdr .sub{color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 16px}
.tabs{display:flex;gap:6px;margin:22px 0 18px;flex-wrap:wrap}
.tab{font:600 15px var(--font-body);padding:9px 16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sub-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.sub-tabs button{font:600 14px var(--font-body);background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.sub-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
@media (max-width:700px){.sub-tabs{flex-wrap:wrap;overflow-x:visible;gap:4px;border-bottom:0}.sub-tabs button{border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}.sub-tabs button[aria-selected="true"]{border-color:var(--accent);background:var(--surface2)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;min-width:0}
.card>h3{margin-bottom:10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;font:15px var(--font-body);color:var(--ink);background:var(--surface2);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px}
textarea{min-height:90px;resize:vertical}
.btn{font:600 14px var(--font-body);padding:8px 14px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--muted)}
.chip.good{color:var(--good);border-color:var(--good)} .chip.warn{color:var(--warn);border-color:var(--warn)} .chip.bad{color:var(--bad);border-color:var(--bad)}
.list>.item{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.6fr) auto;gap:8px 14px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.list>.item:first-child{border-top:0}
.item .nm{font-weight:600}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.item .full{grid-column:1/-1}
@media (max-width:620px){.list>.item{grid-template-columns:1fr}.item .acts{justify-content:flex-start}}
.copy{background:none;border:0;padding:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer;text-align:left}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.t,th.t{text-align:left;white-space:normal;min-width:130px}
td.pts{font-family:var(--font-display);font-size:19px;font-weight:700}
tr.q td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
tr.me td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
tr.out td{color:var(--muted);text-decoration:line-through}
.match{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--surface);min-width:0}
.match.is-live{border-color:var(--live);box-shadow:inset 4px 0 0 var(--live)}
.mmeta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--muted);margin-bottom:6px;align-items:center}
.mmeta .time{font-family:var(--font-display);font-size:19px;color:var(--ink);font-weight:700;letter-spacing:.02em}
.tag{font-weight:600;color:var(--accent)}
.livetag{background:var(--live);color:#fff;font-weight:700;font-size:11px;padding:1px 8px;border-radius:999px;letter-spacing:.08em;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}} @media (prefers-reduced-motion:reduce){.livetag{animation:none}}
.mteams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.tm{font-weight:600;overflow-wrap:anywhere}
.tm.right{text-align:right}
.tm.me{color:var(--accent)}
.score{font-family:var(--font-display);font-size:32px;font-weight:700;line-height:1;min-width:76px;text-align:center;font-variant-numeric:tabular-nums}
.score i{font-style:normal;color:var(--muted);padding:0 4px}
.vs{font-size:15px;color:var(--muted);font-family:var(--font-body);font-weight:500}
.pens{text-align:center;font-size:12px;color:var(--muted);margin-top:2px}
.mrow .ins{display:flex;gap:6px;align-items:center;justify-content:center}
.mrow .ins input{width:54px;text-align:center;font:700 20px var(--font-display);padding:5px}
.mrow .ed{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.mrow .ed input,.mrow .ed select{width:auto}
.hero{background:var(--ink);color:var(--bg);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.hero .k{font-size:12px;text-transform:uppercase;letter-spacing:.1em;opacity:.7}
.hero .big{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1.05;margin:4px 0}
.hero .tm{color:inherit}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)}
.pill{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;font-size:14px}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface);margin-bottom:16px}
summary{font-weight:600;cursor:pointer}
details ul{margin:10px 0 0;padding-left:18px} details li{margin-bottom:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;max-width:min(92vw,520px);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.sel{max-width:420px}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.stars{color:#e0a100;letter-spacing:1px;white-space:nowrap}.stars .off{color:var(--line)}
.catd>summary{display:flex;align-items:center;gap:8px;list-style:none}.catd>summary::-webkit-details-marker{display:none}.catd>summary::before{content:'▸';font-size:18px;color:var(--accent);transition:transform .15s}.catd[open]>summary::before{transform:rotate(90deg)}.catd>summary>h3,.catd>summary>.bar{flex:1;margin:0}.catd[open]>summary{margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty" style="margin-top:40px">Se încarcă turneul…</div></div>
<div id="toast" role="status"></div>

<script src="vendor/supabase.js"></script>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)};
var S={cfg:null,schools:[],teams:[],matches:[],fr:[],acfg:null};
var DEF={name:'Cupa Mini-Fotbal',date:'',location:'',contact:'',fee:'',appLink:'https://turneefotbal.ro',fields:2,matchMin:15,breakMin:5,rest:1,start:'09:00',maxGroup:4,qualify:2,categories:'U10, U11, U12, U13, U14, U15, U16, U17, U18, U19, U20, U21, U22',catYears:'',regText:'',pw:3,pd:1};
var FRS=null,frRegs=[],frMine=[],frToken='',atab='program',frWeekSel='',frCat='',frDraft=null,frDirty=false,frErr=[],aotab='reg',lastFr='',lastFrS='',DB=null,sb=null,session=null,regToken='',authMsg='',loginEmail='',recovery=false,lastMy='',noDb=false,canEdit=false,regs=[],myReg=null,regDraft=null,regDirty=false,regErrors=[],rejOpen=null,tab='live',otab='inscrieri',pcat='',search='',editSchool=null,inviteOpen=null,elimOpen=null,armed=null,busy=false,pendingRender=false;
var cfg=function(){return Object.assign({},DEF,S.cfg||{})};
var cats=function(){return cfg().categories.split(',').map(function(s){return s.trim()}).filter(Boolean)};
var T=function(){var o={};S.teams.forEach(function(t){o[t.id]=t});return o};
var M=function(){var o={};S.matches.forEach(function(m){o[m.id]=m});return o};
var isElim=function(id){var t=T()[id];return !!t&&t.st==='elim'};
var nm=function(id){var t=T()[id];return t?t.name:'?'};

/* ---------- logică turneu ---------- */
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rrRounds(ids){var a=ids.slice();if(a.length%2)a.push(null);var n=a.length,rounds=[];
  for(var r=0;r<n-1;r++){var pairs=[];for(var i=0;i<n/2;i++){var h=a[i],b=a[n-1-i];if(h&&b)pairs.push(r%2?[b,h]:[h,b])}rounds.push(pairs);a.splice(1,0,a.pop())}
  return rounds}
function bracketOrder(N){var o=[1],size=1;while(o.length<N){var nx=[];o.forEach(function(s){nx.push(s,2*size+1-s)});o=nx;size*=2}return o}
function slotTime(slot){var c=cfg();var p=c.start.split(':').map(Number);var t=p[0]*60+p[1]+slot*(+c.matchMin+ +c.breakMin);return String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function eff(m){var eh=isElim(m.home),ea=isElim(m.away);if(eh&&ea)return[0,0];if(eh)return[0,3];if(ea)return[3,0];if(m.st==='fin')return[+m.hs,+m.as];return null}
function standings(ids,ms){
  var c=cfg(),R={};ids.forEach(function(i){R[i]={id:i,j:0,v:0,e:0,l:0,gm:0,gp:0,pts:0}});
  var res=ms.map(function(m){return{m:m,r:eff(m)}}).filter(function(x){return x.r&&R[x.m.home]&&R[x.m.away]});
  res.forEach(function(o){var m=o.m,r=o.r,h=R[m.home],a=R[m.away];h.j++;a.j++;h.gm+=r[0];h.gp+=r[1];a.gm+=r[1];a.gp+=r[0];
    if(r[0]>r[1]){h.v++;a.l++;h.pts+=+c.pw}else if(r[0]<r[1]){a.v++;h.l++;a.pts+=+c.pw}else{h.e++;a.e++;h.pts+=+c.pd;a.pts+=+c.pd}});
  var rows=Object.keys(R).map(function(k){return R[k]});
  rows.forEach(function(x){x.dg=x.gm-x.gp;var tied=rows.filter(function(y){return y.pts===x.pts}).map(function(y){return y.id});var p=0,g=0,f=0;
    res.forEach(function(o){var m=o.m,r=o.r;if(tied.indexOf(m.home)>-1&&tied.indexOf(m.away)>-1&&(m.home===x.id||m.away===x.id)){
      var mine=m.home===x.id?r[0]:r[1],th=m.home===x.id?r[1]:r[0];g+=mine-th;f+=mine;p+=mine>th?+c.pw:(mine===th?+c.pd:0)}});
    x.hp=tied.length>1?p:0;x.hg=tied.length>1?g:0;x.hf=tied.length>1?f:0});
  rows.sort(function(a,b){return b.pts-a.pts||b.hp-a.hp||b.hg-a.hg||b.hf-a.hf||b.dg-a.dg||b.gm-a.gm||nm(a.id).localeCompare(nm(b.id),'ro')});
  return rows}
function groupsOf(cat){var gm=S.matches.filter(function(m){return m.cat===cat&&m.stage==='G'});var letters=[];gm.forEach(function(m){if(letters.indexOf(m.group)<0)letters.push(m.group)});letters.sort();
  return letters.map(function(L){var ms=gm.filter(function(m){return m.group===L});var ids=[];ms.forEach(function(m){[m.home,m.away].forEach(function(x){if(ids.indexOf(x)<0)ids.push(x)})});return{letter:L,ids:ids,ms:ms}})}
function winnerOf(m){if(!m)return null;var h=resolve(m.home),a=resolve(m.away);if(!h||!a)return null;
  if(isElim(h)&&!isElim(a))return a;if(isElim(a)&&!isElim(h))return h;if(m.st!=='fin')return null;
  if(+m.hs>+m.as)return h;if(+m.hs<+m.as)return a;
  if(m.hp!=null&&m.ap!=null&&m.hp!==''&&+m.hp!==+m.ap)return +m.hp>+m.ap?h:a;return null}
function resolve(ref){if(!ref)return null;if(String(ref).indexOf('W:')===0)return winnerOf(M()[ref.slice(2)]);return ref}
function refName(ref){var r=resolve(ref);if(r)return nm(r);if(ref&&String(ref).indexOf('W:')===0){var s=M()[ref.slice(2)];return 'Câștigător M'+(s?s.no:'?')}return '—'}
function tn(ref){var r=resolve(ref);var s=esc(refName(ref));return r&&isElim(r)?s+' <span class="chip bad">eliminată</span>':s}

function schedule(list,taken,teamLast){
  var c=cfg(),F=Math.max(1,+c.fields),rest=+c.rest,rem=list.slice(),slot=0;
  while(rem.length&&slot<3000){var busyT={},used=0;
    for(var i=0;i<rem.length&&used<F;){var m=rem[i];var ok=slot>=(m.minSlot||0);
      if(ok&&m._deps)ok=m._deps.every(function(d){return d.slot>=0&&slot>d.slot+rest});
      var tms=[m.home,m.away].filter(function(x){return x&&String(x).indexOf('W:')!==0});
      if(ok)ok=tms.every(function(x){return !busyT[x]&&(teamLast[x]===undefined||slot-teamLast[x]>rest)});
      var f=0;if(ok){for(f=1;f<=F;f++){if(!taken[slot+'|'+f])break}if(f>F)ok=false}
      if(ok){m.slot=slot;m.field=f;m.time=slotTime(slot);taken[slot+'|'+f]=1;tms.forEach(function(x){busyT[x]=1;teamLast[x]=slot});rem.splice(i,1);used++}else i++}
    slot++}
  return rem.length===0}

async function run(arr,n){for(var i=0;i<arr.length;i+=n){await Promise.all(arr.slice(i,i+n).map(function(f){return f()}))}}
async function wipeMatches(){if(S.matches.length)await DB.bulkDelete('matches',S.matches.map(function(m){return m.id}))}
async function writeMatches(ms){await DB.bulkSet('matches',ms.map(function(m){var o={};Object.keys(m).forEach(function(k){if(k[0]!=='_'&&k!=='minSlot')o[k]=m[k]});return{id:m.id,data:o}}))}

async function genGroups(){
  var c=cfg(),prio=[],any=false;
  cats().forEach(function(cat){
    var ts=S.teams.filter(function(t){return t.cat===cat&&t.st!=='elim'});if(ts.length<2)return;any=true;
    var g=Math.ceil(ts.length/Math.max(2,+c.maxGroup)),cap=Math.ceil(ts.length/g),groups=[];for(var i=0;i<g;i++)groups.push([]);
    shuffle(ts.slice()).forEach(function(t){var open=[];groups.forEach(function(x,i){if(x.length<cap)open.push(i)});
      var pick=open.filter(function(i){return !groups[i].some(function(o){return o.school&&o.school===t.school})});var pool=pick.length?pick:open;
      pool.sort(function(a,b){return groups[a].length-groups[b].length});groups[pool[0]].push(t)});
    groups.forEach(function(gr,gi){var L=String.fromCharCode(65+gi);
      rrRounds(gr.map(function(t){return t.id})).forEach(function(pairs,ri){pairs.forEach(function(p){(prio[ri]=prio[ri]||[]).push({id:uid(),cat:cat,stage:'G',group:L,rd:'Grupa '+L,home:p[0],away:p[1]})})})})});
  if(!any)throw new Error('Adaugă cel puțin 2 echipe într-o categorie.');
  var list=prio.flat(),taken={},last={};
  if(!schedule(list,taken,last))throw new Error('Programul nu a putut fi alcătuit. Mărește numărul de terenuri sau reduce pauza dintre meciuri.');
  list.sort(function(a,b){return a.slot-b.slot||a.field-b.field});
  list.forEach(function(m,i){m.no=i+1;m.st='prog';m.hs=null;m.as=null});
  await wipeMatches();await writeMatches(list);
  return list.length+' meciuri, ultimul la '+slotTime(Math.max.apply(null,list.map(function(m){return m.slot})))}

async function genKO(cat){
  var c=cfg(),G=groupsOf(cat),q=+c.qualify,g=G.length;
  var tops=G.map(function(x){return standings(x.ids,x.ms).slice(0,q)});
  var entries;
  if(q===2&&g%2===0){var f=[],s=[];for(var i=0;i<g;i+=2){f.push(tops[i][0].id,tops[i+1][1].id);s.push(tops[i+1][0].id,tops[i][1].id)}entries=f.concat(s)}
  else{var seeds=[];tops.forEach(function(r){r.forEach(function(x,ri){seeds.push({id:x.id,ri:ri,pts:x.pts,dg:x.dg,gm:x.gm})})});
    seeds.sort(function(a,b){return a.ri-b.ri||b.pts-a.pts||b.dg-a.dg||b.gm-a.gm});
    var N0=1;while(N0<seeds.length)N0*=2;entries=bracketOrder(N0).map(function(s){return seeds[s-1]?seeds[s-1].id:null})}
  var N=1;while(N<entries.length)N*=2;while(entries.length<N)entries.push(null);
  var created=[],nextNo=Math.max.apply(null,[0].concat(S.matches.map(function(m){return m.no||0})))+1,cur=entries,byId={};
  while(cur.length>1){var cnt=cur.length/2,name=cnt===1?'Finala':cnt===2?'Semifinale':cnt===4?'Sferturi':cnt===8?'Optimi':'Runda de '+cnt*2,nxt=[];
    for(var i=0;i<cur.length;i+=2){var h=cur[i],a=cur[i+1];
      if(h&&!a){nxt.push(h);continue}if(!h&&a){nxt.push(a);continue}if(!h&&!a){nxt.push(null);continue}
      var m={id:uid(),cat:cat,stage:'K',rd:name,home:h,away:a,no:nextNo++,st:'prog',hs:null,as:null,hp:null,ap:null};byId[m.id]=m;
      m._deps=[h,a].filter(function(x){return String(x).indexOf('W:')===0}).map(function(x){return byId[x.slice(2)]});created.push(m);nxt.push('W:'+m.id)}
    cur=nxt}
  var taken={},last={},maxG=-1;
  S.matches.forEach(function(m){if(m.slot>=0){taken[m.slot+'|'+m.field]=1;[m.home,m.away].forEach(function(x){if(x&&String(x).indexOf('W:')!==0)last[x]=Math.max(last[x]===undefined?-1:last[x],m.slot)});if(m.cat===cat&&m.stage==='G')maxG=Math.max(maxG,m.slot)}});
  created.forEach(function(m){if(!m._deps.length)m.minSlot=maxG+1});
  if(!schedule(created,taken,last))throw new Error('Nu s-au putut programa eliminatoriile.');
  await writeMatches(created);
  return created.length+' meciuri eliminatorii pentru '+cat}

function regArticles(){var c=cfg(),q=+c.qualify,ys=cats().map(function(k){var y=yearsOf(k);return y?k+': născuți în '+yrTxt(y):k+': anii de naștere se anunță de organizator'});

  ['Verificarea vârstei','Organizatorul verifică vârsta copiilor pe baza documentelor, la sosire și în orice moment al turneului. Verificările se pot face și prin sondaj, la orice meci. În cadrul sondajului, copiii pot fi întrebați despre vârsta, anul nașterii sau clasa lor, în prezența antrenorului sau a unui părinte, fără presiune și fără a fi umiliți. Rezultatul se consemnează într-un proces-verbal. Răspunsurile copilului se coroborează cu documentele.'],
  ['Eliminarea echipelor','O echipă care folosește un copil din afara categoriei de vârstă pentru care s-a înscris este eliminată direct din turneu. Echipa pierde taxa de înscriere și dreptul la premii. Meciurile jucate de echipa eliminată se socotesc pierdute cu 3–0, iar clasamentele se recalculează. Organizatorul poate suspenda școala și antrenorul pentru ediția următoare.'],

  ['Contestații','Contestațiile se depun la organizator, în scris, în cel mult 30 de minute de la încheierea meciului. Organizatorul decide, iar decizia sa este finală.'],

function frSlots(week,c){var L=+c.matchMin+ +c.breakMin,out=[];
  DAYS.forEach(function(d){var dc=c.days[d];if(!dc.on)return;var a=hm(dc.from),b=hm(dc.to);for(var s=a;s+ +c.matchMin<=b;s+=L)out.push({day:d,date:addDays(week,DAYO[d]),time:mh(s),min:s})});
  return out}
function frFits(r,sl,c){return (r.avail||[]).some(function(a){return a.d===sl.day&&hm(a.from)<=sl.min&&sl.min+ +c.matchMin<=hm(a.to)})}
function frPlan(week,regsW,keep,c){
  var slots=frSlots(week,c),F=Math.max(1,+c.fields),used={},cnt={},played={},busy={},add=[];
  keep.forEach(function(m){if(m.st==='anulat')return;used[m.date+'|'+m.time+'|'+m.field]=1;
    [m.home,m.away].forEach(function(x){cnt[x]=(cnt[x]||0)+1;(busy[x]=busy[x]||{})[m.date+'|'+m.time]=1});played[m.home+'|'+m.away]=played[m.away+'|'+m.home]=1});
  var freeField=function(sl){for(var f=1;f<=F;f++)if(!used[sl.date+'|'+sl.time+'|'+f])return f;return 0};
  var free=function(r,sl){return !(busy[r.id]||{})[sl.date+'|'+sl.time]};
  var cap=function(r){return Math.min(+r.max||1,+c.maxPer||1)};
  var need=function(r){return cap(r)-(cnt[r.id]||0)};
  var opts={};regsW.forEach(function(r){opts[r.id]=slots.filter(function(s){return frFits(r,s,c)}).length});
  var cl=frCats();
  cl.forEach(function(cat){
    var order=regsW.filter(function(r){return r.cat===cat&&r.status==='activa'}).sort(function(a,b){return (a.at||0)-(b.at||0)});
    if(c.mode==='fit')order=order.slice().sort(function(a,b){return opts[a.id]-opts[b.id]||(a.at||0)-(b.at||0)});
    for(var pass=0;pass<3;pass++){var inPass={};
      order.forEach(function(a){
        if(need(a)<=0||inPass[a.id])return;
        var cand=order.filter(function(b){return b!==a&&need(b)>0&&!inPass[b.id]&&!played[a.id+'|'+b.id]});
        cand=cand.filter(function(b){return b.school!==a.school}).concat(cand.filter(function(b){return b.school===a.school}));
        var feas=[];
        cand.forEach(function(b){var sl=null;for(var i=0;i<slots.length;i++){var s=slots[i];if(frFits(a,s,c)&&frFits(b,s,c)&&free(a,s)&&free(b,s)&&freeField(s)){sl=s;break}}if(sl)feas.push({b:b,sl:sl})});
        if(!feas.length)return;
        var pick=feas[0];
        if(c.mode==='fit')pick=feas.slice().sort(function(x,y){return opts[x.b.id]-opts[y.b.id]})[0];
        var f=freeField(pick.sl),b=pick.b;
        used[pick.sl.date+'|'+pick.sl.time+'|'+f]=1;
        [a,b].forEach(function(x){cnt[x.id]=(cnt[x.id]||0)+1;(busy[x.id]=busy[x.id]||{})[pick.sl.date+'|'+pick.sl.time]=1;inPass[x.id]=1});
        played[a.id+'|'+b.id]=played[b.id+'|'+a.id]=1;
        add.push({week:week,cat:cat,home:a.id,away:b.id,homeName:frName(a),awayName:frName(b),day:pick.sl.day,date:pick.sl.date,time:pick.sl.time,field:f,st:'prog',hs:null,as:null})})}});
  return add}

  var ch=[];regsW.forEach(function(r){if(r.status!=='activa')return;var s=has[r.id]?'prog':'fara';if(r.sched!==s){ch.push(Object.assign({},r,{sched:s}))}});return ch}

async function frGenerate(full){

    onSnapshot:function(next,err){return watch(t,function(rows){var d=rows.filter(function(x){return x.id===id})[0];next({exists:!!d,data:function(){return d?d.data:undefined}})},err)}}},
  collection:function(t){return{onSnapshot:function(next,err){return watch(t,function(rows){next({docs:rows.map(function(x){return{id:x.id,data:function(){return x.data}}})})},err)}}},
  bulkSet:async function(t,rows){var parts=chunk(rows,100);for(var i=0;i<parts.length;i++){var c=parts[i];var r=await sb.from(t).upsert(c.map(function(x){return{id:x.id,data:x.data,updated_at:new Date().toISOString()}})).select('id');if(r.error)throw dberr(r.error);if(!r.data||r.data.length<c.length)throw denied()}refresh(t)},
  bulkDelete:async function(t,ids){var parts=chunk(ids,100);for(var i=0;i<parts.length;i++){var r=await sb.from(t).delete().in('id',parts[i]);if(r.error)throw dberr(r.error)}refresh(t)}}}

/* ---------- pornire ---------- */
async function boot(){
  var h=(location.hash||'').replace('#','');
  var valid=['organizator','inscriere','amicale','live','regulament','login'];
  if(!(window.supabase&&window.supabase.createClient)){noDb=true;tab='regulament';render(true);return}
  try{sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(e){noDb=true;tab='regulament';render(true);return}
  DB=makeDB();
  try{var gs=await sb.auth.getSession();session=gs.data.session}catch(e){session=null}
  sb.auth.onAuthStateChange(function(ev,s){session=s;if(ev==='PASSWORD_RECOVERY'){recovery=true;tab='login'}setTimeout(refreshAdmin,0)});
  try{regToken=localStorage.getItem('tf-reg-token')||''}catch(e){regToken=''}
  try{frToken=localStorage.getItem('tf-fr-token')||''}catch(e){frToken=''}
  var lastErr=0;var err=function(){if(Date.now()-lastErr>60000){lastErr=Date.now();toast('Conexiunea cu datele a fost întreruptă. Reîncarcă pagina.',true)}};
  var docs=function(s){return s.docs.map(function(d){return Object.assign({id:d.id},d.data())})};
  DB.doc('config/main').onSnapshot(function(s){S.cfg=s.exists?s.data():null;sched()},err);
  DB.doc('config/amicale').onSnapshot(function(s){S.acfg=s.exists?s.data():null;sched()},err);
  DB.collection('fr_matches').onSnapshot(function(s){S.fr=docs(s);sched()},err);
  DB.collection('fr_regs').onSnapshot(function(s){frRegs=docs(s);sched()},err);
  ['schools','teams','matches'].forEach(function(n){DB.collection(n).onSnapshot(function(s){S[n]=docs(s);sched()},err)});
  DB.collection('regs').onSnapshot(function(s){regs=docs(s);sched()},err);
  DB.doc('config/reviews').onSnapshot(function(s){RCFG=s.exists?s.data():null;sched()},err);
  DB.collection('club_ratings').onSnapshot(function(s){ratings=docs(s);sched()},err);
  DB.collection('referees').onSnapshot(function(s){refs=docs(s);sched()},err);
  DB.collection('reviews').onSnapshot(function(s){revs=docs(s);sched()},err);
  DB.doc('config/abonament').onSnapshot(function(s){SCFG=s.exists?s.data():null;sched()},err);
  DB.collection('subscriptions').onSnapshot(function(s){subsL=docs(s).map(function(d){return d});sched()},err);
  await refreshAdmin();
  tab=valid.indexOf(h)>-1?h:(canEdit?'organizator':'live');
  await loadMyReg();await loadFrState();await loadMyFr();await loadRev();await loadMyRev();await loadMySub();await loadAdm();
  render(true);
  var tick=function(){if(document.hidden)return;Object.keys(subs).forEach(function(t){refresh(t)});loadMyReg();loadFrState();loadMyFr();loadRev();loadMyRev();loadMySub();loadAdm()};
  setInterval(tick,20000);
  document.addEventListener('visibilitychange',tick);
  window.addEventListener('online',tick)}
boot();
})();
